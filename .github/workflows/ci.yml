name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  engine:
    name: Core engine + tests (no JUCE)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The engine must build and test on a machine with no JUCE and no GUI
      # libraries - that is the module boundary, checked by CI rather than by
      # code review.
      - name: Configure
        run: cmake -S . -B build-core -DGUITAR_BUILD_APP=OFF -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build-core

      - name: Test
        run: ctest --test-dir build-core --output-on-failure

      # The number of tests is quoted in two places a reader looks, and a number
      # nothing checks is a number that goes stale. The suite itself is the only
      # thing that knows the answer, so it is asked here.
      - name: The quoted test count is the real one
        run: |
          count=$(./build-core/tests/guitar_core_tests | sed -n 's|^\([0-9]*\)/[0-9]* tests passed$|\1|p')
          test -n "$count"
          echo "the suite reports $count tests"

          for file in README.md web/index.html; do
            grep -q "$count unit tests\|unit tests ($count)" "$file" \
              || { echo "::error file=$file::says a test count that is not $count"; exit 1; }
          done

      # An engine call the app cannot answer is the quietest failure this project
      # has: the browser is fine, the app replies "no engine call named that",
      # the page's `call()` hands back ok:false, and the feature simply does not
      # happen - with no error anywhere. Both shells are asked here instead.
      - name: Both shells answer every call the page makes
        run: |
          grep -oE '(^|[^a-zA-Z])call\("guitar[A-Za-z]*"' web/index.html \
            | grep -oE 'guitar[A-Za-z]*' | sort -u > /tmp/page-calls
          test -s /tmp/page-calls
          echo "the page makes $(wc -l < /tmp/page-calls) kinds of engine call"

          missing=0

          while read -r name; do
            grep -q "name == \"$name\"" app/src/WebUi.cpp \
              || { echo "::error file=app/src/WebUi.cpp::the app cannot answer $name"; missing=1; }
            grep -q "\"_$name\"" web/build.sh \
              || { echo "::error file=web/build.sh::the WebAssembly build does not export $name"; missing=1; }
          done < /tmp/page-calls

          test "$missing" -eq 0

  app:
    name: Standalone app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The app's UI is a web page in a webview, so the Linux build needs
      # WebKitGTK on top of the usual JUCE packages.
      - name: Install JUCE build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxcomposite-dev \
            libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev \
            libxrender-dev libfreetype6-dev libfontconfig1-dev \
            libglu1-mesa-dev mesa-common-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build
